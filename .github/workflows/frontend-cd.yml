name: Frontend Build CD

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                node-version: '20'
            - name: Build frontend
              run: |
                cd frontend
                npm ci
                npm run build
              env:
                VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
            - name: Open a pull request for the build
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                git config user.email "github-actions@github.com"
                git config user.name "GitHub Actions"
                git add frontend/dist
                if git diff --cached --quiet; then
                  echo "No frontend changes to publish"
                  exit 0
                fi
                git commit -m "Build frontend"
                git push --force origin HEAD:frontend-dist-build
                if gh pr view frontend-dist-build --json number --jq .number >/dev/null 2>&1; then
                  echo "Updated the open frontend build pull request"
                else
                  gh pr create --base main --head frontend-dist-build --title "Build frontend" --body "Publishes the frontend/dist build from main. The live site serves these files, and main only accepts them through a pull request."
                fi
