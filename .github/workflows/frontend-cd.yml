name: Check and deploy TigerLift
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tigerlift-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tigerlift
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tigerlift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://tigerlift:test-only@localhost:5432/tigerlift_test
          EMAILS_ON: 'False'
      - run: python -m unittest discover -s deploy/tests -v
      - run: bash -n deploy/release.sh
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
      - name: Package source and freshly built frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/tigerlift-package
          git archive HEAD | tar -x -C /tmp/tigerlift-package
          rm -rf /tmp/tigerlift-package/frontend/dist
          cp -R frontend/dist /tmp/tigerlift-package/frontend/dist
          tar -czf /tmp/tigerlift-release.tar.gz -C /tmp/tigerlift-package .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tigerlift-release
          path: /tmp/tigerlift-release.tar.gz
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tigerlift-release
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: arn:aws:iam::104733724423:role/TigerLiftGitHubDeployRole
          aws-region: us-east-1
      - name: Deploy the tested release and wait for server health checks
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bucket=tigerlift-deploy-104733724423-us-east-1
          aws s3 cp tigerlift-release.tar.gz "s3://$bucket/releases/$RELEASE_SHA.tar.gz" --only-show-errors
          checksum=$(sha256sum tigerlift-release.tar.gz | cut -d ' ' -f 1)
          command=$(aws ssm send-command --document-name TigerLiftDeploy \
            --instance-ids i-0b2bfc5624ab3f9bf \
            --parameters "Commit=$RELEASE_SHA,Checksum=$checksum" \
            --query Command.CommandId --output text)
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command" \
              --instance-id i-0b2bfc5624ab3f9bf --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command" \
            --instance-id i-0b2bfc5624ab3f9bf \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$status" = Success
      - name: Verify the public site serves this release
        run: |
          mkdir expected
          tar -xzf tigerlift-release.tar.gz -C expected ./frontend/dist/index.html
          curl --fail --silent --show-error --retry 3 https://lift.tigerapps.org/ -o live.html
          cmp expected/frontend/dist/index.html live.html
